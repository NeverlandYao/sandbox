<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智语奇旅</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-decor" aria-hidden="true"></div>
  <main class="app-shell">

    <!-- 导航栏 -->
    <nav class="app-nav card">
      <button class="nav-tab active" data-target="view-ai-challenge">技能沙盘</button>
    </nav>

    <!-- 视图：技能沙盘 -->
    <div id="view-ai-challenge" class="view-section active">
      <header class="hero card">
        <div class="hero-copy-block">
          <p class="eyebrow">技能沙盘 · 智语奇旅</p>
          <h1>语音助手技能沙盘</h1>
          <p class="hero-copy">在这里，你将化身“AI 创想家”，直接测试语音助手，或设计并提交全新的应用场景。</p>
        </div>
        <div class="hero-mascot">
          <div class="mascot-face">
            <span></span>
            <span></span>
          </div>
          <div class="mascot-mouth"></div>
          <p class="mascot-text">"准备好接受挑战了吗？"</p>
        </div>
      </header>

      <section class="card main-panel">
        <div class="panel-head">
          <div>
            <p class="panel-tag">任务一</p>
            <h2>智能语音助手测试</h2>
          </div>
          <button id="resetTask1Btn" class="ghost-btn">清空对话</button>
        </div>

        <div class="voice-bar">
          <button id="task1VoiceBtn" class="voice-btn" type="button">开始语音输入</button>
          <button id="task1SpeakToggleBtn" class="ghost-btn" type="button">朗读讲解：关</button>
          <div id="task1VoiceStatus" class="voice-status">正在检测语音支持…</div>
        </div>

        <div id="task1Log" class="chat-log" aria-live="polite"></div>

        <div class="input-area">
          <input
            id="task1Input"
            type="text"
            placeholder="试试输入：什么是AI / 我心情不好..."
          >
          <button id="task1SendBtn" class="primary-btn">发送</button>
        </div>
      </section>

      <!-- 任务二：场景设计 -->
      <section class="card main-panel" style="margin-top: 24px;">
        <div class="panel-head">
          <div>
            <p class="panel-tag">任务二</p>
            <h2>设计应用场景方案</h2>
          </div>
          <button id="resetTask2Btn" class="ghost-btn">清空方案</button>
        </div>
        <p class="generator-tip" style="margin-bottom: 12px;">以“解决生活中的某个痛点”为目标，设计一个全新的智能语音助手应用场景方案。</p>
        
        <div class="generator-form">
          <label for="task2Scenario">1. 场景描述（明确需求痛点）</label>
          <textarea id="task2Scenario" rows="2" placeholder="例如：做饭时满手油污，想记录突然冒出的灵感..."></textarea>
          
          <label for="task2Design">2. 语音助手的功能设计（体现至少2个AI核心特征）</label>
          <textarea id="task2Design" rows="2" placeholder="例如：具备语音唤醒和自然语言理解能力，能自动提炼核心词..."></textarea>
          
          <label for="task2Effect">3. 预期效果（如何提升生活质量）</label>
          <textarea id="task2Effect" rows="2" placeholder="例如：无缝记录灵感，解放双手，提高效率..."></textarea>
          
          <button id="task2SendBtn" class="primary-btn" style="margin-top: 8px;">提交方案</button>
        </div>
        
        <div id="task2Log" class="chat-log" style="display: none; margin-top: 16px;" aria-live="polite"></div>
      </section>
    </div> <!-- end view-ai-challenge -->

  </main>

  <script src="./script.js"></script>
</body>
</html>
